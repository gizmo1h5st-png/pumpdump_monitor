<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pump & Dump Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0b0e11; color:#eaecef; font-family:system-ui,-apple-system,sans-serif; }
  .card { background:#1e2329; border-radius:12px; padding:14px; margin-bottom:12px; }
  .btn { background:#f0b90b; color:#0b0e11; padding:10px 16px; border-radius:8px; font-weight:700; border:none; }
  .btn.secondary { background:#2b3139; color:#eaecef; }
  .muted { color:#848e9c; font-size:12px; }
</style>
</head>
<body>
<div class="max-w-md mx-auto p-4">
  <h1 class="text-xl font-bold mb-4">🚀 Pump & Dump Monitor</h1>

  <div class="card">
    <div class="flex items-center justify-between mb-2">
      <span class="font-semibold">Мониторинг</span>
      <button id="pauseBtn" class="btn secondary text-sm">⏸ Пауза</button>
    </div>
    <div class="muted" id="statusText">Загрузка…</div>
  </div>

  <div class="card">
    <h2 class="font-semibold mb-3">⚙️ Настройки</h2>
    <form id="settingsForm" class="space-y-3">
      <div>
        <label class="muted">Таймфрейм</label>
        <select id="tf" class="w-full bg-[#2b3139] rounded px-3 py-2 text-sm">
          <option value="1">1m</option><option value="5">5m</option><option value="15">15m</option>
          <option value="30">30m</option><option value="60">1h</option><option value="240">4h</option>
        </select>
      </div>
      <div>
        <label class="muted">Порог памп/дамп (%)</label>
        <input id="thr" type="number" step="0.1" class="w-full bg-[#2b3139] rounded px-3 py-2 text-sm" value="5">
      </div>
      <div>
        <label class="muted">Зона интереса (±%)</label>
        <input id="zone" type="number" step="0.1" class="w-full bg-[#2b3139] rounded px-3 py-2 text-sm" value="2">
      </div>
      <div>
        <label class="muted">OB ATR multiplier</label>
        <input id="ob" type="number" step="0.1" class="w-full bg-[#2b3139] rounded px-3 py-2 text-sm" value="1.5">
      </div>
      <div>
        <label class="muted">Мин. лоты для разметки</label>
        <input id="lot" type="number" step="0.1" class="w-full bg-[#2b3139] rounded px-3 py-2 text-sm" value="10">
      </div>
      <div class="flex items-center gap-2">
        <input id="fvg" type="checkbox" checked class="accent-yellow-500"> <label for="fvg" class="text-sm">Показывать FVG</label>
      </div>
      <button type="submit" class="btn w-full">💾 Сохранить</button>
    </form>
  </div>

  <div class="card">
    <h2 class="font-semibold mb-2">📊 Последние алерты</h2>
    <div id="alertsBox" class="space-y-2">
      <div class="muted">Загрузка…</div>
    </div>
  </div>
</div>

<script>
  const API = window.location.origin.includes('localhost') ? 'http://localhost:8000' : window.location.origin;
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const chatId = tg.initDataUnsafe?.user?.id || 0;

  async function loadSettings(){
    if(!chatId) return;
    const r = await fetch(`${API}/api/settings?chat_id=${chatId}`);
    const s = await r.json();
    document.getElementById('tf').value = s.timeframe;
    document.getElementById('thr').value = s.pump_threshold;
    document.getElementById('zone').value = s.zone_pct;
    document.getElementById('ob').value = s.ob_mult;
    document.getElementById('lot').value = s.lot_threshold;
    document.getElementById('fvg').checked = s.fvg_enabled;
    document.getElementById('statusText').textContent = s.paused ? '⏸ На паузе' : '▶️ Активен';
  }

  document.getElementById('settingsForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const body = {
      chat_id: chatId,
      timeframe: document.getElementById('tf').value,
      pump_threshold: parseFloat(document.getElementById('thr').value),
      zone_pct: parseFloat(document.getElementById('zone').value),
      ob_mult: parseFloat(document.getElementById('ob').value),
      lot_threshold: parseFloat(document.getElementById('lot').value),
      fvg_enabled: document.getElementById('fvg').checked ? 1 : 0,
    };
    const r = await fetch(`${API}/api/settings`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    alert(j.ok ? 'Сохранено!' : 'Ошибка');
  });

  function fmtPct(v){
    const sign = v > 0 ? '+' : '';
    return sign + v.toFixed(2) + '%';
  }

  async function loadAlerts(){
    if(!chatId) return;
    const r = await fetch(`${API}/api/alerts?chat_id=${chatId}&limit=5`);
    const data = await r.json();
    const box = document.getElementById('alertsBox');
    if(!data.alerts || !data.alerts.length){ box.innerHTML = '<div class="muted">Пока нет алертов</div>'; return; }
    box.innerHTML = data.alerts.map(a => {
      const color = a.direction === 'PUMP' ? 'text-green-400' : 'text-red-400';
      return `<div class="bg-[#2b3139] rounded p-2 text-sm">
        <div class="font-bold ${color}">${a.direction} ${a.symbol}</div>
        <div class="muted">${fmtPct(a.change_percent)} @ ${a.price}</div>
        <div class="muted">${a.timestamp ? a.timestamp.slice(0,16) : ''}</div>
      </div>`;
    }).join('');
  }

  loadSettings();
  loadAlerts();
</script>
</body>
</html>
